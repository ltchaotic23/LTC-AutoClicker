name: CI

on:
  push:
    branches: [ "master", "main" ]
  pull_request:
    branches: [ "master", "main" ]

jobs:
  test:
    runs-on: windows-latest

    steps:
    - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

    - name: Set up Python 3.12
      uses: actions/setup-python@0b93645e9fea7318edeed2796c01426a612af339 # v5.3.0
      with:
        python-version: "3.12"
        cache: "pip"

    - name: Install dependencies (pinned lockfile)
      run: |
        python -m pip install --upgrade pip
        python -m pip install -r LTC-AutoClicker-v2/requirements-lock.txt

    - name: Run automated test suite
      run: |
        cd LTC-AutoClicker-v2
        python -m unittest discover -s tests -v
